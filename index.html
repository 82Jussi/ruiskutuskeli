<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruiskutuskeli</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e7d32">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ruiskutuskeli">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f3f3}header{background:#2e7d32;color:#fff;padding:12px;display:flex;justify-content:space-between;font-size:22px;font-weight:bold}.card{background:#fff;margin:10px;padding:10px;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.15)}#map{height:300px}.green{background:#cdf3cd}.yellow{background:#fff4b0}.red{background:#ffcaca}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px;text-align:center;border-bottom:1px solid #ddd}th{position:sticky;top:0;background:#ddd}.summary{display:flex;justify-content:space-around;font-weight:bold}dialog{width:min(95vw,420px)}label{display:block;margin-top:8px}input{width:100%;padding:6px;box-sizing:border-box}
</style>
</head>
<body>
<header><span>Ruiskutuskeli</span><span id="settingsBtn">⚙️</span></header>
<div class="card"><div id="bestWindow">Haetaan...</div></div>
<div class="card"><div id="map"></div></div>
<div class="card summary"><div>🟢 <span id="greenCount">0</span> h</div><div>🟡 <span id="yellowCount">0</span> h</div><div>🔴 <span id="redCount">0</span> h</div></div>
<div class="card"><table><thead><tr><th>Aika</th><th>Tuuli 10m (m/s)</th><th>Puuskat 10m (m/s)</th><th>Sade %</th><th>Sade (mm/h)</th><th>Kosteus (%)</th></tr></thead><tbody id="forecastBody"></tbody></table></div>
<dialog id="settingsDialog"><h2>Asetukset</h2>
<label>Tuuli vihreä max<input id="windGreen" type="number" step="0.1"></label>
<label>Tuuli keltainen max<input id="windYellow" type="number" step="0.1"></label>
<label>Puuska vihreä max<input id="gustGreen" type="number" step="0.1"></label>
<label>Puuska keltainen max<input id="gustYellow" type="number" step="0.1"></label>
<label>Sade% vihreä max<input id="rainGreen" type="number"></label>
<label>Sade% keltainen max<input id="rainYellow" type="number"></label>
<label>Kosteus keltainen min<input id="humYellowMin" type="number"></label>
<label>Kosteus vihreä min<input id="humGreenMin" type="number"></label>
<label>Kosteus vihreä max<input id="humGreenMax" type="number"></label>
<button onclick="saveSettings()">Tallenna</button>
<button onclick="settingsDialog.close()">Sulje</button></dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DEF={windGreen:4,windYellow:7,gustGreen:6,gustYellow:9,rainGreen:20,rainYellow:50,humYellowMin:50,humGreenMin:60,humGreenMax:85};
let settings=JSON.parse(localStorage.getItem('ruiskutuskeliSettings')||'null')||DEF;let map,marker;
function fillForm(){for(const k in settings){const e=document.getElementById(k);if(e)e.value=settings[k];}}
function saveSettings(){for(const k in settings){settings[k]=Number(document.getElementById(k).value)}localStorage.setItem('ruiskutuskeliSettings',JSON.stringify(settings));settingsDialog.close();if(marker){const p=marker.getLatLng();loadForecast(p.lat,p.lng)}}
settingsBtn.onclick=()=>{fillForm();settingsDialog.showModal();};
function wind(v){return v<=settings.windGreen?'green':v<=settings.windYellow?'yellow':'red'}
function gust(v){return v <= settings.gustGreen? 'green': v <= settings.gustYellow? 'yellow': 'red';}
function rain(v){return v<=settings.rainGreen?'green':v<=settings.rainYellow?'yellow':'red'}
function hum(v){if(v<settings.humYellowMin)return 'red';if(v<settings.humGreenMin)return 'yellow';if(v<=settings.humGreenMax)return 'green';return 'red'}
function overall(a,b,c,d){if(a==='red'||b==='red'||c==='red'||d==='red')return 'red';if(a==='green'&&b==='green'&&c==='green'&&d==='green')return 'green';return 'yellow'}
async function loadForecast(lat,lon){const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=wind_speed_10m,wind_gusts_10m,precipitation_probability,precipitation,relative_humidity_2m&forecast_days=3`);const d=await res.json();forecastBody.innerHTML='';let g=0,y=0,r=0,bs=null,be=null,cs=null,longest=0;for(let i=0;i<d.hourly.time.length;i++){const rowTime=new Date(d.hourly.time[i]);if(rowTime<new Date())continue;const st=overall(wind(d.hourly.wind_speed_10m[i]),gust(d.hourly.wind_gusts_10m[i]),rain(d.hourly.precipitation_probability[i]),hum(d.hourly.relative_humidity_2m[i]));if(st==='green')g++;else if(st==='yellow')y++;else r++;if(st==='green'){if(cs===null)cs=i}else if(cs!==null){if(i-cs>longest){longest=i-cs;bs=cs;be=i-1}cs=null}const tr=document.createElement('tr');tr.className=st;tr.innerHTML=`<td>${rowTime.toLocaleString('fi-FI',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${d.hourly.wind_speed_10m[i]}</td><td>${d.hourly.wind_gusts_10m[i]}</td><td>${d.hourly.precipitation_probability[i]}</td><td>${d.hourly.precipitation[i]}</td><td>${d.hourly.relative_humidity_2m[i]}</td>`;forecastBody.appendChild(tr)}greenCount.textContent=g;yellowCount.textContent=y;redCount.textContent=r;if(bs!==null){bestWindow.innerHTML='Paras ruiskutusikkuna:<br>'+new Date(d.hourly.time[bs]).toLocaleString('fi-FI',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' - '+new Date(d.hourly.time[be]).toLocaleString('fi-FI',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' ('+longest+' h)'}else{bestWindow.textContent='Ei optimaalista ruiskutusikkunaa'}}
function initMap(lat,lon){map=L.map('map').setView([lat,lon],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);marker=L.marker([lat,lon]).addTo(map);map.on('click',e=>{marker.setLatLng(e.latlng);loadForecast(e.latlng.lat,e.latlng.lng)});loadForecast(lat,lon)}
fillForm();if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>initMap(p.coords.latitude,p.coords.longitude),()=>initMap(62.89,27.88));}else{initMap(62.89,27.88)}if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js')}
</script></body></html>
