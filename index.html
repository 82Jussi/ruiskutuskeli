<!DOCTYPE html><html lang="fi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruiskutuskeli</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2e7d32"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5}header{display:flex;justify-content:space-between;align-items:center;background:#2e7d32;color:#fff;padding:12px;font-size:22px;font-weight:bold}.card{background:#fff;margin:10px;padding:10px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.15)}#map{height:300px}.summary{display:flex;justify-content:space-around}.green{background:#c8f0c8}.yellow{background:#fff5b1}.red{background:#ffc8c8}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px;text-align:center;border-bottom:1px solid #ddd}dialog{width:min(90vw,400px)}</style></head><body><header>Ruiskutuskeli <span id="settingsBtn">⚙️</span></header><div class="card"><div id="bestWindow">Haetaan...</div></div><div class="card"><div id="map"></div></div><div class="card summary"><div>🟢 <span id="greenCount">0</span> h</div><div>🟡 <span id="yellowCount">0</span> h</div><div>🔴 <span id="redCount">0</span> h</div></div><div class="card"><table><thead><tr><th>Aika</th><th>Tuuli</th><th>Sade %</th><th>mm/h</th><th>Kosteus</th></tr></thead><tbody id="forecastBody"></tbody></table></div><dialog id="settingsDialog"><h2>Asetukset</h2><p>Muokkaa rajoja koodissa tai laajenna asetuksia myöhemmin.</p><button onclick="settingsDialog.close()">Sulje</button></dialog><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const S={windGreen:4,windYellow:7,rainGreen:20,rainYellow:50,humYellowMin:50,humGreenMin:60,humGreenMax:85};let map,marker;settingsBtn.onclick=()=>settingsDialog.showModal();function ws(v){return v<=S.windGreen?'green':v<=S.windYellow?'yellow':'red'}function rs(v){return v<=S.rainGreen?'green':v<=S.rainYellow?'yellow':'red'}function hs(v){return v<S.humYellowMin?'red':v<S.humGreenMin?'yellow':v<=S.humGreenMax?'green':'red'}function oc(a,b,c){if(a==='red'||b==='red'||c==='red')return 'red';if(a==='green'&&b==='green'&&c==='green')return 'green';return 'yellow'}async function loadForecast(lat,lon){const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=wind_speed_10m,precipitation_probability,precipitation,relative_humidity_2m&forecast_days=3`);const d=await r.json();forecastBody.innerHTML='';let g=0,y=0,re=0,bs=null,be=null,cs=null,l=0;for(let i=0;i<d.hourly.time.length;i++){const st=oc(ws(d.hourly.wind_speed_10m[i]),rs(d.hourly.precipitation_probability[i]),hs(d.hourly.relative_humidity_2m[i]));if(st==='green')g++;else if(st==='yellow')y++;else re++;if(st==='green'){if(cs===null)cs=i}else if(cs!==null){if(i-cs>l){l=i-cs;bs=cs;be=i-1}cs=null}const tr=document.createElement('tr');tr.className=st;tr.innerHTML=`<td>${new Date(d.hourly.time[i]).toLocaleString('fi-FI')}</td><td>${d.hourly.wind_speed_10m[i]}</td><td>${d.hourly.precipitation_probability[i]}</td><td>${d.hourly.precipitation[i]}</td><td>${d.hourly.relative_humidity_2m[i]}</td>`;forecastBody.appendChild(tr)}greenCount.textContent=g;yellowCount.textContent=y;redCount.textContent=re;if(bs!==null){bestWindow.innerHTML='Paras ruiskutusikkuna:<br>'+new Date(d.hourly.time[bs]).toLocaleString('fi-FI')+' - '+new Date(d.hourly.time[be]).toLocaleString('fi-FI')+' ('+l+' h)'}else bestWindow.textContent='Ei optimaalista ruiskutusikkunaa'}function init(lat,lon){map=L.map('map').setView([lat,lon],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);marker=L.marker([lat,lon]).addTo(map);map.on('click',e=>{marker.setLatLng(e.latlng);loadForecast(e.latlng.lat,e.latlng.lng)});loadForecast(lat,lon)}navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>init(p.coords.latitude,p.coords.longitude),()=>init(62.89,27.88)):init(62.89,27.88);if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js')}</script></body></html>
