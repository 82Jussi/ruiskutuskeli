<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruiskutuskeli</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e7d32">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ruiskutuskeli">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f3f3}
header{background:#2e7d32;color:#fff;padding:12px;display:flex;justify-content:space-between;font-size:22px;font-weight:bold}
.card{background:#fff;margin:10px;padding:10px;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.15)}
#map{height:300px}
.green{background:#cdf3cd}
.yellow{background:#fff4b0}
.red{background:#ffcaca}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px;text-align:center;border-bottom:1px solid #ddd}
th{position:sticky;top:0;background:#ddd}
.summary{display:flex;justify-content:space-around;font-weight:bold}
dialog{box-sizing:border-box;width:min(92vw,420px);max-width:92vw;max-height:85vh;overflow-y:auto;padding:14px;border:none;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0 0 6px;font-size:20px}
label{display:block;margin-top:8px;font-size:14px}
/* 16px estää iPhonen automaattisen zoomauksen kenttää napautettaessa */
input{width:100%;padding:6px;box-sizing:border-box;font-size:16px}
dialog button{margin-top:12px;padding:8px 16px;font-size:16px}
html,body{overflow-x:hidden}
footer{margin:16px 10px 12px;padding-top:8px;border-top:1px solid #ddd;font-size:11px;color:#777;text-align:center}
footer a{color:#777}
</style>

</head>
<body>

<header>
  <span>Ruiskutuskeli</span>
  <span id="settingsBtn">⚙️</span>
</header>

<div class="card">
  <div id="bestWindow">Haetaan...</div>
</div>

<div class="card">
  <div id="map"></div>
</div>

<div class="card summary">
  <div>🟢 <span id="greenCount">0</span> h</div>
  <div>🟡 <span id="yellowCount">0</span> h</div>
  <div>🔴 <span id="redCount">0</span> h</div>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Aika</th>
        <th>Lämpö (°C)</th>
        <th>Tuuli (m/s)</th>
        <th>Sade (mm/h)</th>
        <th>Kosteus (%)</th>
      </tr>
    </thead>
    <tbody id="forecastBody"></tbody>
  </table>
</div>

<footer>
  Säädata: <a href="https://www.ilmatieteenlaitos.fi/avoin-data" target="_blank" rel="noopener">Ilmatieteen laitos</a> (avoin data, CC BY 4.0) ·
  Kartta: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-tekijät
</footer>

<dialog id="settingsDialog">
  <h2>Asetukset</h2>

  <label>Tuuli vihreä max
    <input id="windGreen" type="number" step="0.1">
  </label>

  <label>Tuuli keltainen max
    <input id="windYellow" type="number" step="0.1">
  </label>

  <label>Sade vihreä max (mm/h)
    <input id="rainGreen" type="number" step="0.1">
  </label>

  <label>Sade keltainen max (mm/h)
    <input id="rainYellow" type="number" step="0.1">
  </label>

  <label>Kosteus keltainen min
    <input id="humYellowMin" type="number">
  </label>

  <label>Kosteus vihreä min
    <input id="humGreenMin" type="number">
  </label>

  <label>Kosteus vihreä max
    <input id="humGreenMax" type="number">
  </label>

  <label>Kosteus keltainen max
    <input id="humYellowMax" type="number">
  </label>

  <button type="button" onclick="saveSettings()">Tallenna</button>
  <button type="button" onclick="settingsDialog.close()">Sulje</button>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const DEF = {
  windGreen:4,
  windYellow:7,
  rainGreen:0,
  rainYellow:0.5,
  humYellowMin:50,
  humGreenMin:60,
  humGreenMax:85,
  humYellowMax:90
};

let settings = {...DEF,
  ...(JSON.parse(localStorage.getItem('ruiskutuskeliSettings') || 'null') || {})};

let map, marker;

function fillForm(){
  for(const k in settings){
    const e=document.getElementById(k);
    if(e)e.value=settings[k];
  }
}

function saveSettings(){
  for(const k in settings){
    const el=document.getElementById(k);
    if(!el) continue;
    const v=parseFloat(el.value);
    if(Number.isFinite(v)) settings[k]=v;
  }

  localStorage.setItem(
    'ruiskutuskeliSettings',
    JSON.stringify(settings)
  );

  settingsDialog.close();

  if(marker){
    const p=marker.getLatLng();
    loadForecast(p.lat,p.lng);
  }
}

settingsBtn.onclick=()=>{
  fillForm();
  settingsDialog.showModal();
};

function wind(v){
  return v<=settings.windGreen
    ? 'green'
    : v<=settings.windYellow
    ? 'yellow'
    : 'red';
}

function rain(v){
  return v<=settings.rainGreen
    ? 'green'
    : v<=settings.rainYellow
    ? 'yellow'
    : 'red';
}

function hum(v){
  if(v<settings.humYellowMin) return 'red';
  if(v<settings.humGreenMin) return 'yellow';
  if(v<=settings.humGreenMax) return 'green';
  if(v<=settings.humYellowMax) return 'yellow';
  return 'red';
}

function overall(a,b,c){
  if(a==='red'||b==='red'||c==='red')
    return 'red';

  if(
    a==='green' &&
    b==='green' &&
    c==='green'
  )
    return 'green';

  return 'yellow';
}

const FMT={day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'};
let loadSeq=0;
async function loadForecast(lat,lon){
  const seq=++loadSeq;
  try{
    bestWindow.textContent="Haetaan FMI-dataa...";
    const now=new Date(); now.setMinutes(0,0,0);
    const end=new Date(now.getTime()+72*3600*1000);
    const url="https://opendata.fmi.fi/wfs?service=WFS&version=2.0.0&request=getFeature"+
      "&storedquery_id=fmi::forecast::edited::weather::scandinavia::point::timevaluepair"+
      "&latlon="+lat.toFixed(4)+","+lon.toFixed(4)+
      "&parameters=Temperature,WindSpeedMS,Humidity,Precipitation1h"+
      "&timestep=60"+
      "&starttime="+now.toISOString()+"&endtime="+end.toISOString();
    const res=await fetch(url,{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const doc=new DOMParser().parseFromString(await res.text(),"text/xml");
    if(seq!==loadSeq) return;
    // Jokainen parametri omana aikasarjanaan -> arvot yhdistetään aikaleiman mukaan
    const data={};
    for(const ts of doc.getElementsByTagNameNS("*","MeasurementTimeseries")){
      const id=(ts.getAttribute("gml:id")||"").toLowerCase();
      const p=id.substring(id.lastIndexOf("-")+1);
      for(const tvp of ts.getElementsByTagNameNS("*","MeasurementTVP")){
        const t=tvp.getElementsByTagNameNS("*","time")[0]?.textContent.trim();
        const v=parseFloat(tvp.getElementsByTagNameNS("*","value")[0]?.textContent);
        if(!t) continue;
        (data[t]??={})[p]=Number.isFinite(v)?v:null;
      }
    }
    const first=new Date(); first.setMinutes(0,0,0); first.setHours(first.getHours()+1);
    const rows=Object.keys(data).sort()
      .map(t=>({time:new Date(t),...data[t]}))
      .filter(r=>r.time>=first);
    forecastBody.innerHTML='';
    let g=0,y=0,r=0,bs=-1,be=-1,cs=-1,longest=0;
    const fmt=v=>v==null?'–':v.toFixed(1);
    rows.forEach((row,i)=>{
      const tC=row.temperature, w=row.windspeedms, rn=row.precipitation1h, h=row.humidity;
      const st=(w==null||rn==null||h==null)?'red':overall(wind(w),rain(rn),hum(h));
      if(st==='green')g++; else if(st==='yellow')y++; else r++;
      if(st==='green'){ if(cs<0)cs=i; }
      else if(cs>=0){ if(i-cs>longest){longest=i-cs;bs=cs;be=i-1;} cs=-1; }
      const tr=document.createElement('tr'); tr.className=st;
      tr.innerHTML=`<td>${row.time.toLocaleString('fi-FI',FMT)}</td>
        <td>${fmt(tC)}</td>
        <td>${fmt(w)}</td>
        <td>${fmt(rn)}</td><td>${h==null?'–':h.toFixed(0)}</td>`;
      forecastBody.appendChild(tr);
    });
    if(cs>=0 && rows.length-cs>longest){longest=rows.length-cs;bs=cs;be=rows.length-1;}
    greenCount.textContent=g; yellowCount.textContent=y; redCount.textContent=r;
    if(!rows.length) bestWindow.textContent='Ei ennustedataa tälle pisteelle';
    else if(bs>=0){
      const endT=new Date(rows[be].time.getTime()+3600*1000);
      bestWindow.innerHTML='Paras ruiskutusikkuna:<br>'+
        rows[bs].time.toLocaleString('fi-FI',FMT)+' – '+endT.toLocaleString('fi-FI',FMT)+
        ' ('+longest+' h)';
    } else bestWindow.textContent='Ei optimaalista ruiskutusikkunaa';
  }catch(err){
    console.error(err);
    if(seq===loadSeq) bestWindow.textContent='FMI-datan haku epäonnistui';
  }
}
function initMap(lat,lon){

  map = L.map('map').setView([lat,lon],10);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution:'© OpenStreetMap'
    }
  ).addTo(map);

  marker = L.marker([lat,lon]).addTo(map);

  map.on('click',e=>{
    marker.setLatLng(e.latlng);
    loadForecast(e.latlng.lat,e.latlng.lng);
  });

  loadForecast(lat,lon);
}

fillForm();

if(navigator.geolocation){

  navigator.geolocation.getCurrentPosition(
    p=>initMap(
      p.coords.latitude,
      p.coords.longitude
    ),
    ()=>initMap(62.89,27.88)
  );

}else{

  initMap(62.89,27.88);
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./service-worker.js');
}

</script>

</body>
</html>
