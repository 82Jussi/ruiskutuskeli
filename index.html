<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruiskutuskeli v1.1</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body><header><div><h1>🌾 Ruiskutuskeli</h1><small>v1.1</small></div><button id="gear">⚙️</button></header><div id="best" class="card">Valitse piste kartalta</div><div id="map"></div><div class="card"><table><thead><tr><th>Aika</th><th>Tuuli (m/s)</th><th>Sade %</th><th>Kosteus %</th><th>Pisteet</th></tr></thead><tbody id="rows"></tbody></table></div><div id="modal" class="modal"><div class="panel"><h3>Asetukset</h3><label>Vihreä piste-raja<input id="green" type="number"></label><label>Keltainen piste-raja<input id="yellow" type="number"></label><hr><label>Tuuli vihreä max<input id="windGreen" type="number"></label><label>Tuuli keltainen max<input id="windYellow" type="number"></label><label>Tuuli punainen max<input id="windRed" type="number"></label><label>Sade vihreä max %<input id="rainGreen" type="number"></label><label>Sade keltainen max %<input id="rainYellow" type="number"></label><label>Kosteus vihreä min<input id="humGreenMin" type="number"></label><label>Kosteus vihreä max<input id="humGreenMax" type="number"></label><label>Kosteus keltainen min<input id="humYellowMin" type="number"></label><label>Kosteus keltainen max<input id="humYellowMax" type="number"></label><hr><label>Tuulen paino<input id="windWeight" type="number"></label><label>Sateen paino<input id="rainWeight" type="number"></label><label>Kosteuden paino<input id="humidityWeight" type="number"></label><button id="save">Tallenna</button></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
