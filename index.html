<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruiskutusikkuna</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Ruiskutusikkuna 72h</h1>
<div id="map"></div>
<button id="settingsBtn">Asetukset</button>
<div id="settings" class="hidden">
<h3>Pisterajat</h3>
<label>Vihreä alkaen <input id="green" type="number" value="80"></label>
<label>Keltainen alkaen <input id="yellow" type="number" value="60"></label>
<button id="save">Tallenna</button>
</div>
<p>Klikkaa karttaa valitaksesi pisteen.</p>
<table>
<thead><tr><th>Aika</th><th>Tuuli</th><th>Sade %</th><th>Kosteus %</th><th>Pisteet</th></tr></thead>
<tbody id="forecast"></tbody>
</table>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
